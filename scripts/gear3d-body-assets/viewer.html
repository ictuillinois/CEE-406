import * as THREE from 'three';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';

window.THREE=THREE;
window.loadModel=async(url)=>{
 if(url.endsWith('.obj')) return new OBJLoader().parse(await (await fetch(url)).text());

};
window.renderModel=async(url,view='iso')=>{

 return {size:size.toArray(),center:center.toArray(),nodes:model.children.map(n=>n.name)};
};window.ready=true;
</script></body></html>
