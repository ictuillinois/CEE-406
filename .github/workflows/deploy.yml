name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (first run only)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The base path is NOT detected any more. It used to be derived from
      # Pages visibility (public -> /CEE-406/), which was right for a project
      # page and wrong for a custom domain: cee406.com serves from the root,
      # so a /CEE-406/ base 404'd every stylesheet and the site rendered
      # unstyled. The target is fixed in astro.config.mjs, and public/CNAME
      # binds the domain on every deploy.
      - name: Build Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
